<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/cadastro.css">
    <title>Linkedin - Cadastro</title>
</head>
<body>
    <div class="area-logo">
        <a href="index.html">
            <img src="../img/logo.png" alt="logo">
        </a>
    </div>
    <div class="caixa">
        <h1>Cadastre-se já no LinkedIn — é grátis!</h1>
       
        <div class="area-do-formulario">
            <form action="index.html" class="form1">
                <label for="">E-mail ou número de telefone</label>
                <input  type="email"id="email" name="senha" required>

                <label for="">Senha</label>
                <input type="password" id="senha" name="senha" minlength="8">

                <button type="submit">Aceite e cadastre-se</button>
            </form>
            <p>Já faz parte do Linkedin? <a href="login.html">Entrar</a></p>
        </div>
    </div>

</body>
</html>
